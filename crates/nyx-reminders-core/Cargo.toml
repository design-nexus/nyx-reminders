[package]
name = "nyx-reminders-core"
version = "0.1.1"
description = "Tasks, smart lists and local metadata for Nyx Reminders"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
nyx-eds = { package = "nyx-pim", git = "https://github.com/design-nexus/nyx-core.git", rev = "1fa444e8c427f8d2f4b6fd6d1ace1c5298e4d623" }
rusqlite = { version = "0.40", features = ["bundled"] }
