[package]
name = "nyx-reminders-core"
version = "0.1.1"
description = "Tasks, smart lists and local metadata for Nyx Reminders"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
nyx-eds = { package = "nyx-pim", git = "https://github.com/design-nexus/nyx-core.git", rev = "918729504918ec344b3a853a5ce0ea2c9dbb7b5f" }
rusqlite = { version = "0.40", features = ["bundled"] }
