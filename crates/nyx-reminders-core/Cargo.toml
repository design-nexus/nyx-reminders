[package]
name = "nyx-reminders-core"
version = "0.1.1"
description = "Tasks, smart lists and local metadata for Nyx Reminders"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
nyx-eds = { package = "nyx-pim", git = "https://github.com/design-nexus/nyx-core.git", rev = "2e7937ebd156a1df7d92457f9a3b35aecfc22ac9" }
rusqlite = { version = "0.40", features = ["bundled"] }
