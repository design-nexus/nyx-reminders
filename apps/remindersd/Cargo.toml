[package]
name = "nyx-remindersd"
version = "0.1.1"
description = "Reminder alerts and the open tasks for Glimpse, in the background"
license.workspace = true
repository.workspace = true
authors.workspace = true
edition.workspace = true

[[bin]]
name = "nyx-remindersd"
path = "src/main.rs"

[dependencies]
toml = "1.1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
gio = "0.22"
glib = "0.22"
nyx-core = { git = "https://github.com/design-nexus/nyx-core.git", rev = "9dc196245bbf0ccc93b8bf04ac61bb476b85e4d5", default-features = false }
nyx-eds = { package = "nyx-pim", git = "https://github.com/design-nexus/nyx-core.git", rev = "9dc196245bbf0ccc93b8bf04ac61bb476b85e4d5" }
nyx-reminders-core = { path = "../../crates/nyx-reminders-core" }
rusqlite = { version = "0.40", features = ["bundled"] }

[dev-dependencies]
gio = "0.22"
glib = "0.22"
nyx-eds = { package = "nyx-pim", git = "https://github.com/design-nexus/nyx-core.git", rev = "9dc196245bbf0ccc93b8bf04ac61bb476b85e4d5" }
