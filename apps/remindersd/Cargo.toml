[package]
name = "nyx-remindersd"
version = "0.1.1"
description = "Reminder alerts and the open tasks for Glimpse, in the background"
license.workspace = true
repository.workspace = true
authors.workspace = true
edition.workspace = true

[[bin]]
name = "nyx-remindersd"
path = "src/main.rs"

[dependencies]
toml = "1.1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
gio = "0.22"
glib = "0.22"
nyx-core = { git = "https://github.com/design-nexus/nyx-core.git", rev = "52cba5e27a3dd5f00c780f53e423302b4b5f9c9c", default-features = false }
nyx-eds = { package = "nyx-pim", git = "https://github.com/design-nexus/nyx-core.git", rev = "1fa444e8c427f8d2f4b6fd6d1ace1c5298e4d623" }
nyx-reminders-core = { path = "../../crates/nyx-reminders-core" }
rusqlite = { version = "0.40", features = ["bundled"] }

[dev-dependencies]
gio = "0.22"
glib = "0.22"
nyx-eds = { package = "nyx-pim", git = "https://github.com/design-nexus/nyx-core.git", rev = "1fa444e8c427f8d2f4b6fd6d1ace1c5298e4d623" }
